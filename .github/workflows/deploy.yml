name: deploy

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      sha:
        required: true
        type: string
      skip_selfcheck:
        default: false
        type: boolean
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_SSH_HOST:
        required: true
      DEPLOY_SSH_USER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ inputs.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName ${{ secrets.DEPLOY_SSH_HOST }}
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF

      - name: 连通性预检
        run: ssh target 'echo SSH_OK && sudo -n docker version --format "{{.Server.Version}}"'

      - name: 同步源码（只传 git 跟踪的文件，通常几 MB）
        run: |
          TARGET=$(ssh target "sudo -n /opt/deploy/bin/deploy.sh where ${{ inputs.project }}")
          [ -n "$TARGET" ] || { echo "::error::conf 里没有 SOURCE_DIR"; exit 1; }
          echo "同步到 $TARGET"
          du -sh . --exclude=.git --exclude=node_modules 2>/dev/null || true
          rsync -az --delete --stats \
            --exclude '.git/' --exclude 'node_modules/' --exclude '.next/' \
            --exclude 'dist/' --exclude '*.log' \
            -e "ssh -F $HOME/.ssh/config" ./ "target:$TARGET/"

      - name: 构建并部署（构建失败不影响线上 → 自检 → 切换 → 验收 → 失败回滚）
        run: |
          ssh target "sudo -n /opt/deploy/bin/deploy.sh deploy ${{ inputs.project }} \
            --build --sha ${{ inputs.sha }} ${{ inputs.skip_selfcheck && '--skip-selfcheck' || '' }}"

      - name: 部署后状态
        if: always()
        run: ssh target "sudo -n /opt/deploy/bin/deploy.sh status ${{ inputs.project }}" || true
