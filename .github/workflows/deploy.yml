# ⚠️ 已停用：本 workflow 不做任何部署，只负责「立刻报错并说明原因」。
#
# 2026-10-19：自研部署器（ssh → /opt/deploy/bin/deploy.sh）整体退役。
# 保留这个文件，是为了有人点了 workflow_dispatch 时能马上看到为什么，
# 而不是拿到一个「连不上服务器 / 超时」的误导性错误。
#
# 发布现在怎么做：工作区 knowledge/new-project.md（Swarm 平台原语）
# 旧实现原文：Projects/.archive-ci-deployer-20261019/
#
# 什么时候可以删掉本文件：10 个项目仓的 `deploy` job 都移除之后。
# 在那之前请勿往这里加任何部署逻辑 —— 加回来就等于重建刚拆掉的那套东西。

name: deploy (retired)

on:
  workflow_call:
    inputs:
      project:
        required: false
        type: string
        default: ""
      sha:
        required: false
        type: string
        default: ""
      skip_selfcheck:
        required: false
        type: boolean
        default: false
      allowed_branch:
        required: false
        type: string
        default: ""
    secrets:
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_SSH_HOST:
        required: false
      DEPLOY_SSH_USER:
        required: false
      DEPLOY_SSH_HOST_FP:
        required: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 说明
        run: |
          echo "::error title=部署器已退役::自研部署器于 2026-10-19 退役，本 workflow 不再部署任何东西。"
          echo "发布流程：工作区 knowledge/new-project.md 与 knowledge/migrate-to-swarm.md"
          echo "旧实现原文：Projects/.archive-ci-deployer-20261019/"
          exit 1
