name: deploy

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      sha:
        required: true
        type: string
      skip_selfcheck:
        default: false
        type: boolean
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_SSH_HOST:
        required: true
      DEPLOY_SSH_USER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ inputs.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName ${{ secrets.DEPLOY_SSH_HOST }}
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF

      - name: 连通性预检
        run: ssh target 'echo SSH_OK && sudo -n docker version --format "{{.Server.Version}}"'

      - name: 同步源码 + 构建 + 部署（同步在锁内 → 自检 → 切换 → 验收 → 失败回滚）
        run: |
          EX=$(ssh target "sudo -n /opt/deploy/bin/deploy.sh excludes ${{ inputs.project }}")
          echo "排除：${EX:-无}"
          pathspec=()
          for p in $EX; do pathspec+=(":(exclude)$p"); done
          git archive --format=tar HEAD -o /tmp/src.tar -- . "${pathspec[@]}"
          ls -lh /tmp/src.tar
          # 源码从 stdin 交给部署器：同步、构建、切换在同一把锁内完成。
          # 拆成两条 ssh 的话，两个部署能交叉写同一个 SOURCE_DIR。
          ssh target "sudo -n /opt/deploy/bin/deploy.sh deploy ${{ inputs.project }} \
            --build --sha ${{ inputs.sha }} --tar - ${{ inputs.skip_selfcheck && '--skip-selfcheck' || '' }}" < /tmp/src.tar

      - name: 部署后状态
        if: always()
        run: ssh target "sudo -n /opt/deploy/bin/deploy.sh status ${{ inputs.project }}" || true
