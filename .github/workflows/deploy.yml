name: deploy

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      sha:
        required: true
        type: string
      skip_selfcheck:
        default: false
        type: boolean
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_SSH_HOST:
        required: true
      DEPLOY_SSH_USER:
        required: true
      REGISTRY_HOST:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ inputs.project }}
      cancel-in-progress: false
    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName ${{ secrets.DEPLOY_SSH_HOST }}
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF

      - name: 连通性预检
        run: ssh target 'echo SSH_OK && sudo -n docker version --format "{{.Server.Version}}"'

      - name: 部署（拉取增量镜像 → 自检 → 切换 → 验收 → 失败回滚）
        run: |
          ssh target "sudo -n /opt/deploy/bin/deploy.sh deploy ${{ inputs.project }} \
            --image ${{ secrets.REGISTRY_HOST }}/${{ inputs.project }}:${{ inputs.sha }} \
            --sha ${{ inputs.sha }} ${{ inputs.skip_selfcheck && '--skip-selfcheck' || '' }}"

      - name: 部署后状态
        if: always()
        run: ssh target "sudo -n /opt/deploy/bin/deploy.sh status ${{ inputs.project }}" || true
