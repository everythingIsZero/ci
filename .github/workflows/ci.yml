name: ci

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      dockerfile:
        default: Dockerfile
        type: string
      context:
        default: .
        type: string
      package_manager:
        default: pnpm
        type: string
      node_version:
        default: "22"
        type: string
      install_cmd:
        default: ""
        type: string
      gate_cmd:
        default: ""
        type: string
      build_args:
        default: ""
        type: string
      upload_image:
        default: true
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
    outputs:
      image:
        description: 本次构建的镜像引用
        value: ${{ jobs.ci.outputs.image }}
      sha:
        description: 本次提交
        value: ${{ jobs.ci.outputs.sha }}

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析元信息
        id: meta
        run: |
          echo "image=${{ inputs.project }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: inputs.package_manager == 'pnpm'
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: 安装依赖
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${{ inputs.install_cmd }}" ]; then
            eval "${{ inputs.install_cmd }}"
          elif [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: 门禁（typecheck / test / lint）
        if: inputs.gate_cmd != ''
        run: eval "${{ inputs.gate_cmd }}"

      - name: 构建镜像
        run: |
          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(--build-arg "$line")
          done <<< "${{ inputs.build_args }}"
          docker build -t "${{ steps.meta.outputs.image }}" \
            -f "${{ inputs.dockerfile }}" "${args[@]}" "${{ inputs.context }}"
          docker image inspect "${{ steps.meta.outputs.image }}" \
            --format '镜像大小 {{.Size}} bytes · 入口 {{.Config.Cmd}}'

      - name: 镜像结构冒烟
        run: |
          img="${{ steps.meta.outputs.image }}"
          docker run --rm --entrypoint sh "$img" -c 'echo 镜像可执行' \
            || echo "::warning::镜像无 sh（distroless/scratch），跳过结构冒烟"

      - name: 导出镜像
        if: inputs.upload_image
        run: docker save "${{ steps.meta.outputs.image }}" | gzip -1 > /tmp/image.tar.gz

      - uses: actions/upload-artifact@v4
        if: inputs.upload_image
        with:
          name: image-${{ inputs.project }}
          path: /tmp/image.tar.gz
          retention-days: 7
