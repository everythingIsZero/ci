name: ci

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      dockerfile:
        default: Dockerfile
        type: string
      context:
        default: .
        type: string
      package_manager:
        default: pnpm
        type: string
      # 留空 = 用 package.json 里的 packageManager 字段。
      # 两个都指定会被 pnpm/action-setup 判成「Multiple versions of pnpm specified」直接失败
      # （2026-10-19 zbh 接入时踩到：仓里写了 pnpm@11.24.0，这里又给 11）。
      pnpm_version:
        default: "11"
        type: string
      node_version:
        default: "22"
        type: string
      install_cmd:
        default: ""
        type: string
      gate_cmd:
        default: ""
        type: string
      build_args:
        default: ""
        type: string
      push_image:
        default: false
        type: boolean
      verify_dockerfile:
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
      REGISTRY_HOST:
        required: false
      REGISTRY_USER:
        required: false
      REGISTRY_PASS:
        required: false
    outputs:
      image:
        description: 本次构建的镜像引用
        value: ${{ jobs.ci.outputs.image }}
      sha:
        description: 本次提交
        value: ${{ jobs.ci.outputs.sha }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # 最小权限：这个 job 只读代码。默认 token 权限更宽，任何依赖的 postinstall
    # 都能读到 .git/config 里的 token 并拿去推仓（供应链自传播）。
    permissions:
      contents: read
    concurrency:
      group: ci-${{ inputs.project }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 解析元信息
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ inputs.project }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "remote=${{ secrets.REGISTRY_HOST }}/${{ inputs.project }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: inputs.package_manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm_version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: 安装依赖
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${{ inputs.install_cmd }}" ]; then
            eval "${{ inputs.install_cmd }}"
          elif [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: 门禁（typecheck / test / lint）
        if: inputs.gate_cmd != ''
        run: eval "${{ inputs.gate_cmd }}"

      - name: 构建镜像
        if: inputs.push_image || inputs.verify_dockerfile
        run: |
          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(--build-arg "$line")
          done <<< "${{ inputs.build_args }}"
          docker build -t "${{ steps.meta.outputs.image }}" \
            -f "${{ inputs.dockerfile }}" "${args[@]}" "${{ inputs.context }}"
          docker image inspect "${{ steps.meta.outputs.image }}" \
            --format '镜像大小 {{.Size}} bytes · 入口 {{.Config.Cmd}}'

      - name: 镜像结构冒烟
        if: inputs.push_image || inputs.verify_dockerfile
        run: |
          img="${{ steps.meta.outputs.image }}"
          docker run --rm --entrypoint sh "$img" -c 'echo 镜像可执行' \
            || echo "::warning::镜像无 sh（distroless/scratch），跳过结构冒烟"

      - name: 登录私有 registry
        if: inputs.push_image
        run: |
          echo "${{ secrets.REGISTRY_PASS }}" | docker login "${{ secrets.REGISTRY_HOST }}" \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: 推送镜像（只传缺失层）
        if: inputs.push_image
        run: |
          docker tag "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.remote }}"
          docker push "${{ steps.meta.outputs.remote }}"
