# card — 自持 compose 形态（纯静态站，nginx 直出）
PROJECT=card
MODE=self-compose

COMPOSE_FILE=/opt/card/app/compose.yml
COMPOSE_PROJECT_DIR=/opt/card
SERVICE=card
CONTAINER=card
IMAGE_LOCAL=card:local
ENV_FILE=
SOURCE_DIR=/opt/card/app

PORT=80
HEALTH_PATH=/
SELFCHECK_WAIT=15

DOMAIN=ka.hxym18.com
SMOKE_PATHS=""
CHECK_COMPRESS=1

# 产物契约（压缩/缓存）：先 warn 观察一轮再转 enforce
ASSET_CONTRACT=warn
