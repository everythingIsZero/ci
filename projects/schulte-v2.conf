# schulte-v2 — 自持 compose 形态（纯静态站，nginx 直出）
PROJECT=schulte-v2
MODE=self-compose

COMPOSE_FILE=/opt/schulte/app/compose.yml
COMPOSE_PROJECT_DIR=/opt/schulte
SERVICE=schulte-v2
CONTAINER=schulte-schulte-v2-1
IMAGE_LOCAL=schulte-schulte-v2
ENV_FILE=
SOURCE_DIR=/opt/schulte/app
# 设计稿/参考图/报告不是运行时依赖，打包时就排除（11.8MB → 约 2MB）
EXCLUDE_PATHS="deliverables reference docs"

PORT=80
HEALTH_PATH=/
SELFCHECK_WAIT=20

# compose.yml 的 build.args 从 /opt/schulte/.env 取值（该文件手工维护、不在仓库里）。
# 缺了不会报错，只会静默构建出「没有统计 id」的镜像 —— 这里把它变成硬失败。
# 确实不要统计：删掉这一行。
BUILD_ENV_REQUIRED="TARO_APP_UMAMI_ID"

DOMAIN=schulte.hxym18.com
SMOKE_PATHS=""
CHECK_COMPRESS=1

# 产物契约（压缩/缓存）：warn 只报告 · enforce 不满足即失败（会触发回滚）
ASSET_CONTRACT=enforce
