# schulte-v2 — 自持 compose 形态（纯静态站，nginx 直出）
PROJECT=schulte-v2
MODE=self-compose

COMPOSE_FILE=/opt/schulte/app/compose.yml
COMPOSE_PROJECT_DIR=/opt/schulte
SERVICE=schulte-v2
CONTAINER=schulte-schulte-v2-1
IMAGE_LOCAL=schulte-schulte-v2
ENV_FILE=
SOURCE_DIR=/opt/schulte/app
# 设计稿/参考图/报告不是运行时依赖，打包时就排除（11.8MB → 约 2MB）
EXCLUDE_PATHS="deliverables reference docs"

PORT=80
HEALTH_PATH=/
SELFCHECK_WAIT=20

DOMAIN=schulte.hxym18.com
SMOKE_PATHS=""
CHECK_COMPRESS=1
COMPRESS_PROBE=auto
