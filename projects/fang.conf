# fang — 集中栈形态（出资人/合同，SQLite + 照片资产卷）
PROJECT=fang
MODE=central-stack

STACK_FILE=/opt/trae-projects/deploy/docker-compose.yml
SERVICE=fang
CONTAINER=deploy-fang-1
IMAGE_LOCAL=deploy-fang:latest
# 变量来自 deploy/.env 的插值（不是 env_file）；自检时同样要喂进去，否则首启 seed 失败
ENV_FILE=/opt/trae-projects/deploy/.env
SOURCE_DIR=/opt/fang/releases/umami-gate-20261008
# 数据卷在 deploy/data/fang，不在 SOURCE_DIR，同步不会碰
SELFCHECK_VOLUME=/app/apps/fang/data

PORT=3000
HEALTH_PATH=/
SELFCHECK_WAIT=25

DOMAIN=fang.hxym18.com
SMOKE_PATHS=""
CHECK_COMPRESS=1

ASSET_CONTRACT=warn
