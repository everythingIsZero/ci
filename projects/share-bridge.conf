# share-bridge — 自持 compose 形态（compose 与 .env、data/ 锚定在 /opt/share-bridge/，代码在 app/）
PROJECT=share-bridge
MODE=self-compose

COMPOSE_FILE=/opt/share-bridge/app/compose.yml
COMPOSE_PROJECT_DIR=/opt/share-bridge
SERVICE=share-bridge
CONTAINER=share-bridge
IMAGE_LOCAL=share-bridge:local
ENV_FILE=/opt/share-bridge/.env
SOURCE_DIR=/opt/share-bridge/app
# SQLite 在数据卷里（宿主 /opt/share-bridge/data），部署前快照
DB_PATH=/opt/share-bridge/data/shares.db

PORT=8200
HEALTH_PATH=/healthz
SELFCHECK_VOLUME=/data
SELFCHECK_WAIT=20

# share.hxym18.com 的 / 由 nginx demo 台接管，Caddy 按路径分流到本服务；
# 所以产物契约与压缩只在 SMOKE_PATHS 上验，不对根路径判红。
DOMAIN=share.hxym18.com
SMOKE_PATHS="/healthz"
CHECK_COMPRESS=0

ASSET_CONTRACT=warn
