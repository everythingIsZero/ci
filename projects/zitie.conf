# zitie — 集中栈形态，服务名是 copybook（不是 zitie）
PROJECT=zitie
MODE=central-stack

STACK_FILE=/opt/trae-projects/deploy/docker-compose.yml
SERVICE=copybook
CONTAINER=deploy-copybook-1
IMAGE_LOCAL=deploy-copybook:latest
ENV_FILE=
SOURCE_DIR=/opt/zitie/releases/20261008
# ⚠️ data/ 是 2.3G 诗词库（poetry.db），不在 git 里但确实在服务器上。
# 不加这条，extract_source 的清空步骤会把它删掉（2026-10-19 发现并已修部署器）。
# 运行时用的是 deploy/data/copybook/poetry.db 的只读挂载，源码目录里的这份不参与构建（.dockerignore 已含 data）。
EXCLUDE_PATHS="data"

PORT=3000
HEALTH_PATH=/
SELFCHECK_VOLUME=/app/data
SELFCHECK_WAIT=25

DOMAIN=wj.hxym18.com
SMOKE_PATHS=""
CHECK_COMPRESS=1

ASSET_CONTRACT=warn
