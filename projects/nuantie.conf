# nuantie — 自持 compose 形态
PROJECT=nuantie
MODE=self-compose

COMPOSE_FILE=/opt/nuantie/app/compose.yml
COMPOSE_PROJECT_DIR=/opt/nuantie
SERVICE=nuantie
CONTAINER=nuantie
IMAGE_LOCAL=nuantie:local
ENV_FILE=/opt/nuantie/.env
SOURCE_DIR=/opt/nuantie/app
EXCLUDE_PATHS="docs deliverables"
# SQLite 实际落在 /opt/data（compose 用了 ../data，历史遗留），部署前做快照
DB_PATH=/opt/data/nuantie.sqlite

PORT=8310
HEALTH_PATH=/healthz
SELFCHECK_VOLUME=/app/server/data
SELFCHECK_WAIT=25

# compose.yml 的 build.args 从 /opt/nuantie/.env 取值（手工维护、不在仓库里）。
# 天地图 key 缺了不会报错，只会构建出地图不可用的镜像 —— 这里变成硬失败。
BUILD_ENV_REQUIRED="NT_TDT_KEY"

DOMAIN=nt.hxym18.com
SMOKE_PATHS="/"
CHECK_COMPRESS=1

# 产物契约（压缩/缓存）：warn 只报告 · enforce 不满足即失败（会触发回滚）
# 2026-10-19 转 enforce：静态缓存策略落到 server/src/static-cache.ts（no-cache + 强 ETag，
# Taro 产物名不带 hash 所以不能 immutable），线上实测 /js/app.js 重复请求 304、传 0 字节。
ASSET_CONTRACT=enforce
